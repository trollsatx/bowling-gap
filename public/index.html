<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gap Matrix — Fit Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#161826;--color-surface:#232532;--color-text:#e9e9ed;
  --color-accent:#9184d9;
  --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);
  --color-neutral-100:#f3f5fe;--color-neutral-300:#cfd3e5;--color-neutral-800:#3f424d;--color-neutral-900:#292b31;
  --color-accent-100:#f5f4ff;--color-accent-800:#423a6a;--color-accent-900:#2b2741;
  --font-heading:"Inter",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif;
  --space-1:2.8px;--space-2:5.6px;--space-3:8.4px;--space-4:11.2px;--space-6:16.8px;--space-8:22.4px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;
  --shadow-md:0 0 0 1px #595d6c,0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg:0 0 0 1px #9397ab,0 16px 40px rgba(0,0,0,0.65);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.55;}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:500;line-height:1.12;letter-spacing:-0.015em;margin:0 0 var(--space-2);}
h4{font-size:18px;}
a{color:var(--color-accent);text-underline-offset:3px;}
a:hover{color:#b5abfc;}
.text-muted{color:color-mix(in srgb,var(--color-text) 55%,transparent);}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}

.nav{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-4);}
.nav-brand{font-family:var(--font-heading);font-weight:600;font-size:18px;margin-left:var(--space-3);margin-right:auto;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;
  font-family:var(--font-heading);font-weight:500;font-size:14px;line-height:1.2;color:var(--color-text);
  background:transparent;border:1px solid transparent;padding:var(--space-2) calc(var(--space-3) * 1.2);border-radius:var(--radius-md);}
.btn-primary{color:var(--color-accent);border-color:var(--color-accent);}
.btn-primary:hover{background:color-mix(in srgb,var(--color-accent) 12%,transparent);}
.btn-secondary{border-color:var(--color-divider);}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent);}
.btn-ghost{color:var(--color-accent);padding-inline:var(--space-1);}
.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent);}

.field>label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:color-mix(in srgb,var(--color-text) 70%,transparent);}
.field{margin-bottom:var(--space-4);}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--color-text);caret-color:var(--color-accent);
  background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);appearance:none;}
.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent);}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0;}

input[type="range"]{accent-color:var(--color-accent);width:100%;height:32px;-webkit-appearance:none;appearance:none;background:transparent;margin:6px 0;}
input[type="range"]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:var(--color-neutral-800);}
input[type="range"]::-moz-range-track{height:8px;border-radius:999px;background:var(--color-neutral-800);}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--color-accent);border:3px solid var(--color-bg);box-shadow:0 0 0 1.5px var(--color-accent),var(--shadow-md);margin-top:-11px;cursor:pointer;}
input[type="range"]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;border:3px solid var(--color-bg);
  background:var(--color-accent);box-shadow:0 0 0 1.5px var(--color-accent),var(--shadow-md);cursor:pointer;}

.seg{display:flex;overflow:hidden;border:1px solid var(--color-divider);border-radius:var(--radius-md);width:100%;margin-bottom:var(--space-6);}
.seg-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;font-size:13px;cursor:pointer;}
.seg-opt+.seg-opt{border-left:1px solid var(--color-divider);}
.seg-opt input{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}
.seg-opt:has(input:checked){color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent);}
.seg-opt:not(:has(input:checked)):hover{background:color-mix(in srgb,var(--color-text) 7%,transparent);}

.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface);margin-bottom:var(--space-4);}
.card-kicker{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent);margin-bottom:6px;}
.card-title{font-family:var(--font-heading);font-weight:500;font-size:17px;line-height:1.2;}
.card-row{cursor:pointer;}
.card-row-head{display:flex;justify-content:space-between;align-items:flex-start;}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;}

.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:0.02em;padding:3px 10px;border-radius:6px;}
.tag-neutral{background:var(--color-neutral-800);color:var(--color-neutral-100);}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent);}

.dialog-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:var(--space-4);
  background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);z-index:10;}
.dialog{width:min(440px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:var(--space-3);
  padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-surface);box-shadow:var(--shadow-lg);}
.dialog-title{font-family:var(--font-heading);font-weight:500;font-size:20px;}
.dialog-actions{display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-2);}

.page{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16.8px 33.6px;}
.subtitle{font-size:13px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-bottom:16.8px;margin-top:-2.8px;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11.2px;}
.section-head h4{margin:0;}
.empty-card{text-align:center;color:var(--color-text);opacity:0.7;}
.result-row{display:flex;align-items:center;gap:11.2px;cursor:pointer;}
.result-rank{width:22px;text-align:center;font-weight:700;font-size:13px;color:color-mix(in srgb,var(--color-text) 55%,transparent);}
.result-total{font-family:var(--font-heading);font-size:26px;font-weight:600;}
.preview-card{background:var(--color-accent-900);}
.preview-grid{display:flex;gap:16.8px;}
.preview-num{font-family:var(--font-heading);font-size:22px;font-weight:600;}
.preview-lbl{font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent);}
.preset-row{display:flex;gap:8.4px;overflow:auto;padding-bottom:5.6px;margin-bottom:11.2px;}
.preset-row .btn{flex-shrink:0;white-space:nowrap;}
.pattern-row{flex-direction:row;align-items:center;gap:8.4px;}
.kosi-summary{font-size:13px;}
.kosi-summary-row{display:flex;justify-content:space-between;padding:5.6px 0;border-bottom:1px solid var(--color-divider);}
.kosi-summary-row:last-child{border-bottom:none;}
.kosi-confidence{font-size:10.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);}
.kosi-warn{font-size:12px;background:color-mix(in srgb, #e0a030 18%, transparent);border:1px solid #e0a030;border-radius:var(--radius-md);padding:8.4px;margin-top:6px;}
.kosi-error{font-size:13px;color:#e08080;}
.file-input-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;}
.detail-total{text-align:center;}
.detail-total .num{font-family:var(--font-heading);font-size:48px;font-weight:600;line-height:1;}
.detail-total .sub{font-size:13px;margin-top:5.6px;color:color-mix(in srgb,var(--color-text) 55%,transparent);}
.detail-radar{display:flex;justify-content:center;}
.detail-metric{padding:8.4px 0;border-bottom:1px solid var(--color-divider);}
.detail-metric:last-child{border-bottom:none;}
.detail-metric-head{display:flex;justify-content:space-between;}
.detail-metric-sub{font-size:11.5px;margin-top:2px;color:color-mix(in srgb,var(--color-text) 55%,transparent);}
</style>
</head>
<body>
<div class="page">
  <div class="nav">
    <div class="nav-brand">Gap Matrix</div>
    <div class="tag tag-outline" id="pattern-type-tag"></div>
  </div>
  <div class="subtitle">Ball-to-pattern fit scoring, coached in plain language.</div>

  <div class="seg" id="tab-seg">
    <label class="seg-opt"><input type="radio" name="tab" value="arsenal"/>Arsenal</label>
    <label class="seg-opt"><input type="radio" name="tab" value="profile"/>Profile</label>
    <label class="seg-opt"><input type="radio" name="tab" value="pattern"/>Pattern</label>
    <label class="seg-opt"><input type="radio" name="tab" value="results"/>Results</label>
  </div>

  <div id="screen"></div>
</div>

<div id="dialogs"></div>

<script>
"use strict";

const CONDITIONERS = {
  Fire: { visc: 0.90, absorb: 0.10, bd: 0.15 },
  Ice: { visc: 0.45, absorb: 0.80, bd: 0.70 },
  Terrain: { visc: 0.75, absorb: 0.30, bd: 0.35 },
  Crown: { visc: 0.65, absorb: 0.45, bd: 0.45 },
  Prodigy: { visc: 0.80, absorb: 0.25, bd: 0.30 },
  None: { visc: 0.30, absorb: 0.95, bd: 0.90 },
};

const BAND_HUES = { Primary: 289, Viable: 230, Marginal: 85, Gap: 25 };

const PRESETS = {
  house: { label: 'House Shot', sheet_length: 39, sheet_ratio: 9, wall_board: 15, pattern_type: 'house', tank: 'dual', cond1: 'Fire', cond2: 'Crown', launch_override: '' },
  sport_short: { label: 'Sport Short', sheet_length: 36, sheet_ratio: 3, wall_board: 6, pattern_type: 'sport_short', tank: 'dual', cond1: 'Ice', cond2: 'Terrain', launch_override: '' },
  sport_long: { label: 'Sport Long', sheet_length: 44, sheet_ratio: 4, wall_board: 8, pattern_type: 'sport_long', tank: 'dual', cond1: 'Fire', cond2: 'Prodigy', launch_override: '' },
  mercury: { label: 'Mercury 4940', sheet_length: 44, sheet_ratio: 2.5, wall_board: 9, pattern_type: 'challenge', tank: 'single', cond1: 'Ice', cond2: 'None', launch_override: 19 },
  greatwall: { label: 'Great Wall of China', sheet_length: 49, sheet_ratio: 3, wall_board: 10, pattern_type: 'challenge', tank: 'dual', cond1: 'Fire', cond2: 'Ice', launch_override: '' },
};

const PT_LABELS = { house: 'House Shot', sport_short: 'Sport Short', sport_long: 'Sport Long', challenge: 'Challenge Pattern' };
const STYLE_LABELS = { stroker: 'Stroker', tweener: 'Tweener', power_player: 'Power player', cranker: 'Cranker' };

const BALL_DEFAULTS = { name: '', rg: 2.50, diff: 0.040, asym: false, psa: 0.010, psaAngle: 0, cover: 'solid', coverGrade: 'reactive', finish: 'matte', grit: 2000, ptp: 4.0, angle: 40, valAngle: 35, layoutFormat: 'dual', pinBuffer: 3.0, massBiasToPap: 4.0 };

const SEED_ARSENAL = [
  { id: 'seed1', name: 'Vengeance', rg: 2.49, diff: 0.052, asym: true, psa: 0.018, psaAngle: 0, cover: 'solid', coverGrade: 'reactive', finish: 'polish', grit: 4000, ptp: 4.5, angle: 45, valAngle: 35, layoutFormat: 'dual', pinBuffer: 3.0, massBiasToPap: 4.0 },
  { id: 'seed2', name: 'HyRoad 40', rg: 2.53, diff: 0.037, asym: false, psa: 0, psaAngle: 0, cover: 'pearl', coverGrade: 'reactive', finish: 'polish', grit: 4000, ptp: 4.0, angle: 40, valAngle: 35, layoutFormat: 'dual', pinBuffer: 3.375, massBiasToPap: 4.25 },
];

const DEFAULT_PATTERN = { sheet_length: 44, sheet_ratio: 2.5, wall_board: 9, pattern_type: 'challenge', tank: 'single', cond1: 'Ice', cond2: 'None', condition: 'Fresh', launch_override: 19, idealAngle: 90 };

const BOWLER_DEFAULTS = { name: '', hand: 'right', pap_lateral: 4.5, pap_vertical: 0.5, speed: 16.5, rev_rate: 350, style: 'tweener', average: 200, sessionLog: [] };
const SEED_BOWLERS = [{ ...BOWLER_DEFAULTS, id: 'bw1', name: 'Player 1' }];

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function clamp01(v) { return clamp(v, 0, 1); }
function toRadians(deg) { return deg * Math.PI / 180; }

// Algorithm v4 constants (see docs/algorithm reference).
const COVER_GRADE_MULT = { polyester: 0.10, entry_reactive: 0.30, reactive: 1.0 };
const K_SPEED = 0.04; // initial constant per spec; no Stage 5 tuning loop implemented (see note above scoreBallAgainst)

// v4 introduces `relativeSpeed` (-2..+2, 0 = baseline) but the app only records a
// bowler's own ball speed in mph, not a per-delivery relative value — this maps one
// to the other. 16.5 mph matches this app's own bowler-speed default, so a bowler
// left at defaults scores as speed-neutral; ±1.75 mph per unit spans a realistic
// stroker-to-cranker range (roughly 13-20 mph) across the full ±2 scale.
const BASELINE_SPEED_MPH = 16.5;
const SPEED_MPH_PER_UNIT = 1.75;
function relativeSpeedFor(bowler) {
  if (!bowler || bowler.speed == null) return 0;
  return clamp((Number(bowler.speed) - BASELINE_SPEED_MPH) / SPEED_MPH_PER_UNIT, -2, 2);
}

function conditionerAvg(cond1, cond2, dual) {
  const c1 = CONDITIONERS[cond1] || CONDITIONERS.None;
  if (!dual) return c1;
  const c2 = CONDITIONERS[cond2] || CONDITIONERS.None;
  return { visc: (c1.visc + c2.visc) / 2, absorb: (c1.absorb + c2.absorb) / 2, bd: (c1.bd + c2.bd) / 2 };
}

// ---------------------------------------------------------------------------
// Scoring algorithm — v4 (see project algorithm reference doc for the full
// derivation and formulas). Stages 1-4 (pattern derivation, lane condition,
// the four scoring components, and the raw-sheet secondary score) are
// implemented in full. Stage 5 (continuous calibration from a logged-session
// history — launch-board line-fit, material-floor/symmetry/speed-constant
// tuning) is NOT implemented: it requires a session log this app doesn't
// have yet. Every Stage 5-dependent value uses the doc's own documented
// cold-start fallback instead (see fittedLaunchBoard), so behavior matches
// what a freshly-calibrated install of the full algorithm would show.
// ---------------------------------------------------------------------------

function deriveStage1(p, relativeSpeed) {
  const dual = p.tank === 'dual';
  const cAvg = conditionerAvg(p.cond1, p.cond2, dual);
  const tankBonus = dual ? 1.0 : 0.72;
  const lenDelta = Math.round(-(1 - cAvg.visc) * 6 * (1 - tankBonus + 0.5));
  const effLen = Math.max(Number(p.sheet_length) + lenDelta, 28);
  const ratioDelta = (1 - cAvg.visc) * 2.5 * (dual ? 0.5 : 1.0);
  const effRatio = Math.max(Number(p.sheet_ratio) - ratioDelta, 1.5);
  const wallShift = Math.round((1 - cAvg.visc) * 4 * (dual ? 0.3 : 1.0));
  const tightnessFactor = p.pattern_type === 'house' ? 1.0 : clamp(effRatio / 6, 0.55, 1.0);
  const effWall = Math.max(Math.round((Number(p.wall_board) + wallShift) * tightnessFactor), 3);
  // Speed-weighted breakdown: a slower-than-baseline bowler spends more time per
  // pass on the same boards, accelerating local pattern breakdown; a faster bowler
  // slows it. Replaces raw breakdownRate everywhere downstream (Stage 2).
  const rs = relativeSpeed || 0;
  const effectiveBreakdown = cAvg.bd * (1 + (0 - rs) * 0.15);
  return { effLen, effRatio, effWall, bd: effectiveBreakdown };
}

function applyLaneCondition(base, condition) {
  const bd = base.bd;
  let lenD = 0, ratioD = 0, wallD = 0;
  if (condition === 'Transition') { lenD = -3 * (0.5 + bd * 0.5); ratioD = -0.8 * (0.5 + bd * 0.5); wallD = -1; }
  else if (condition === 'Burn') { lenD = -6 * (0.5 + bd * 0.5); ratioD = -1.5 * (0.5 + bd * 0.5); wallD = -2; }
  else if (condition === 'Carrydown') { lenD = 5 * (1 - bd * 0.3); ratioD = -0.5; wallD = 1; }
  else if (condition === 'SportBurn') { lenD = -4 * (0.5 + bd * 0.5); ratioD = -1.6; wallD = -3; }
  return {
    effLen: Math.max(base.effLen + lenD, 28),
    effRatio: Math.max(base.effRatio + ratioD, 1.5),
    effWall: Math.max(Math.round(base.effWall + wallD), 3),
  };
}

// Personal launch-board fit (Stage 5). Regresses confirmed launch boards from a
// bowler's logged sessions (per-bowler, since release/speed differ per bowler) once
// at least 5 exist; before that, or if the logged wall boards have no variance to
// regress against, falls back to the documented cold-start estimate (wall + 10).
function fitLaunchBoardRegression(sessionLog) {
  const pts = (sessionLog || []).filter(s => Number.isFinite(s.effWall) && Number.isFinite(s.confirmedLaunchBoard));
  if (pts.length < 5) return null;
  const n = pts.length;
  const xBar = pts.reduce((s, p) => s + p.effWall, 0) / n;
  const yBar = pts.reduce((s, p) => s + p.confirmedLaunchBoard, 0) / n;
  let num = 0, den = 0;
  pts.forEach(p => { num += (p.effWall - xBar) * (p.confirmedLaunchBoard - yBar); den += (p.effWall - xBar) ** 2; });
  if (den === 0) return null; // no wall-board variance to regress against
  const slope = num / den;
  return { slope, intercept: yBar - slope * xBar, n };
}

function fittedLaunchBoard(wall, sessionLog) {
  const fit = fitLaunchBoardRegression(sessionLog);
  return fit ? wall * fit.slope + fit.intercept : wall + 10;
}

function scoreBallAgainst(ball, eff, pattern, relativeSpeed, sessionLog) {
  const rs = relativeSpeed || 0;
  const rgNorm = (ball.rg - 2.45) / 0.20;
  const lenNorm = (eff.effLen - 26) / 28;
  const ratioNorm = clamp01((eff.effRatio - 1.5) / 10.5);
  const gritNorm = (ball.grit - 500) / 3500;

  // Speed-adjusted RG: a slower ball behaves like a lower-RG (earlier-transitioning)
  // ball, a faster one like a higher-RG (later-transitioning) ball. Exponential so
  // it never hard-clips at the extremes.
  let adjustedRgNorm;
  if (rs > 0) adjustedRgNorm = rgNorm + (1 - rgNorm) * (1 - Math.exp(-rs * K_SPEED));
  else if (rs < 0) adjustedRgNorm = rgNorm * Math.exp(rs * K_SPEED);
  else adjustedRgNorm = rgNorm;

  const surfaceShift = (ball.finish === 'polish' ? 0.12 : -0.06) * (1 + (rgNorm - 0.5) * 0.6);
  const gritShift = gritNorm * 0.14;
  const lengthScore = clamp01(1 - Math.abs(adjustedRgNorm - lenNorm) + surfaceShift + gritShift);

  const patReadDemand = (1 - lenNorm) * 0.55 + (1 - ratioNorm) * 0.45;
  const coverBaseMap = { solid: 0.82, hybrid: 0.70, pearl: 0.55, particle: 0.90 };
  const coverBase = coverBaseMap[ball.cover] !== undefined ? coverBaseMap[ball.cover] : 0.70;
  const coreStrength = clamp01((ball.diff - 0.020) / 0.045);
  const effectiveCoverBase = coverBase + (coreStrength - 0.5) * 0.18 * (1 - coverBase);
  const matte = ball.finish === 'matte';
  const coverGradeMult = COVER_GRADE_MULT[ball.coverGrade] ?? COVER_GRADE_MULT.reactive;
  const ballReadEarly = coverGradeMult * ((1 - gritNorm) * 0.40 + (matte ? 0.15 : -0.10) + (effectiveCoverBase - 0.55) * 0.35 + (1 - adjustedRgNorm) * 0.15);
  const surfaceScore = clamp01(1 - Math.abs(patReadDemand - ballReadEarly));

  const launchBoard = pattern.launch_override ? Number(pattern.launch_override) : fittedLaunchBoard(eff.effWall, sessionLog);
  const recovery = Math.max(launchBoard - eff.effWall, 1);
  const timingNeed = recovery > 15 ? 0.3 : recovery > 8 ? 0.5 : 0.8;
  const timingScore = clamp01(1 - Math.abs(timingNeed - (ball.ptp - 2.5) / 3.0));
  const effAngle = ball.layoutFormat === 'vls' ? clamp(20 + ((ball.pinBuffer ?? 3) - 1) * 12, 0, 70) : ball.angle;
  const shapeDemand = recovery / 20;
  const shapeScore = clamp01(1 - Math.abs(shapeDemand - (effAngle - 30) / 40));
  const floorScore = coverGradeMult * 0.15;
  const rawMag = ball.diff / 0.06 + (ball.asym ? Math.min(1, ball.psa / 0.02) * 0.2 : 0);
  const magScore = clamp01(Math.max(Math.min(1, rawMag), floorScore));
  const maxRecovery = ball.diff * 300 + (ball.asym ? ball.psa * 400 : 0) + effAngle * 0.3;
  const rawCap = maxRecovery / (recovery * 2);
  const capScore = clamp01(Math.max(Math.min(1, rawCap), floorScore));
  const surfPct = ball.finish === 'polish' ? 0.10 : (matte ? -0.05 : 0);
  const ptpFactor = (ball.ptp - 2.5) / 10;
  const rgFactor = (ball.rg - 2.45) / 2;
  const totalBoards = recovery;
  const outLeg = totalBoards * (0.5 + ptpFactor + rgFactor) * (1 + surfPct);
  const backLeg = totalBoards - outLeg + totalBoards * (ball.diff * 4 + (ball.asym ? ball.psa * 6 : 0));
  const symScoreBase = 1 - Math.abs(outLeg / Math.max(backLeg, 0.001) - 1.0) * 0.6;
  const directionalBias = ball.asym ? Math.cos(toRadians((ball.psaAngle || 0) - (pattern.idealAngle ?? 90))) * ball.psa * 0.5 : 0;
  const symScore = clamp01(symScoreBase + directionalBias);
  const recoveryScore = (timingScore + shapeScore + magScore + capScore + symScore) / 5;

  const isSportLike = pattern.pattern_type !== 'house';
  let coreScore;
  if (!ball.asym && !isSportLike) coreScore = 0.80;
  else if (!ball.asym && isSportLike) coreScore = 0.67;
  else if (ball.asym && !isSportLike) coreScore = 0.55 + Math.min(0.15, (ball.psa / 0.020) * 0.15);
  else coreScore = 0.65 + Math.min(0.23, (ball.psa / 0.020) * 0.23);

  const total = lengthScore * 25 + surfaceScore * 20 + recoveryScore * 30 + coreScore * 25;
  return { total, lengthScore, surfaceScore, recoveryScore, coreScore };
}

function fullScore(ball, pattern, bowler) {
  const relativeSpeed = relativeSpeedFor(bowler);
  const sessionLog = bowler ? bowler.sessionLog : null;
  const base = deriveStage1(pattern, relativeSpeed);
  const eff = applyLaneCondition(base, pattern.condition);
  const effResult = scoreBallAgainst(ball, eff, pattern, relativeSpeed, sessionLog);
  const sheetEff = { effLen: Number(pattern.sheet_length), effRatio: Number(pattern.sheet_ratio), effWall: Number(pattern.wall_board) };
  const sheetResult = scoreBallAgainst(ball, sheetEff, pattern, relativeSpeed, sessionLog);
  return { ...effResult, eff, sheetTotal: sheetResult.total };
}

function bandFor(total) {
  if (total >= 80) return { label: 'Primary', sub: 'This ball belongs in your hand', hue: BAND_HUES.Primary };
  if (total >= 60) return { label: 'Viable', sub: 'Workable with adjustments', hue: BAND_HUES.Viable };
  if (total >= 40) return { label: 'Marginal', sub: 'Fighting the pattern', hue: BAND_HUES.Marginal };
  return { label: 'Gap', sub: 'Wrong tool for this lane', hue: BAND_HUES.Gap };
}

function radarPoints(l, s, r, c) {
  const R = 45, cx = 65, cy = 65;
  const angles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
  const fracs = [l, s, r, c];
  return angles.map((a, i) => {
    const frac = Math.max(0.04, fracs[i]);
    const x = cx + R * frac * Math.cos(a);
    const y = cy + R * frac * Math.sin(a);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}

function insightFor(r, total) {
  if (total >= 80) return 'Strong all-around match — trust it.';
  const dims = [
    { v: r.lengthScore, msg: 'Skid length is the mismatch — RG and surface aren’t reading this pattern’s zone right.' },
    { v: r.surfaceScore, msg: 'Read timing is off — the cover reads earlier or later than this pattern wants.' },
    { v: r.recoveryScore, msg: 'Recovery is the issue — layout or diff can’t make the trip back to the pocket.' },
    { v: r.coreScore, msg: 'Core shape isn’t ideal for this pattern type.' },
  ];
  dims.sort((a, b) => a.v - b.v);
  return dims[0].msg;
}

function patternSummary(p) {
  return p.sheet_length + 'ft · ' + p.sheet_ratio + ':1 · wall ' + p.wall_board + ' · ' + (PT_LABELS[p.pattern_type] || p.pattern_type);
}

// ---------------------------------------------------------------------------
// Kegel KOSI (.txt) import — experimental
//
// The KOSI export is an undocumented, unlabeled positional dump: one raw
// value per line, grouped into blocks (row counts vary per pattern, 7-8 is
// typical) separated by blank filler lines. It encodes what the lane machine
// executes — board targets, load counts, mic/speed/buff settings — but NOT
// the derived analytics Kegel prints on the pattern sheet (Ratio, Volume,
// T.OIL). Those are computed by Kegel's own software from an oil-deposition
// model we don't have, so we don't attempt to reproduce them exactly.
//
// Verified against 3 real exports (Route 66 V2, Broadway V2, plus the
// original sample). Two consistent findings from that set:
//  - The FIRST block after the name is always file-header metadata (fixed
//    flags, then a redundant copy of the total distance + forward board
//    list), and the LAST block is footer telemetry (flow/volume settings,
//    values in the hundreds/thousands). Neither is pass data; both are
//    excluded from board/load classification below so their large numbers
//    can't get mistaken for board targets.
//  - None of the 3 samples encode a tank letter or conditioner name as
//    plain-word tokens — that path may only fire on other export variants.
//    Distance is the one field consistently confirmed two independent ways
//    (the header's redundant copy vs. the precise per-pass distance table).
// ---------------------------------------------------------------------------

function parseKosiText(text) {
  const rawLines = text.split(/\r?\n/);
  if (rawLines.length < 20) {
    throw new Error("This doesn't look like a Kegel KOSI export (too short).");
  }
  const name = (rawLines[1] || '').trim() || 'Imported pattern';

  const blocks = [];
  let cur = [];
  for (let i = 2; i < rawLines.length; i++) {
    const v = rawLines[i].trim();
    if (v === '') {
      if (cur.length) { blocks.push(cur); cur = []; }
    } else {
      cur.push(v);
    }
  }
  if (cur.length) blocks.push(cur);

  // Row counts vary per pattern (a table might have 6-8 passes, not always 8),
  // so blocks are classified by content shape, not a fixed length. A minimum
  // of 2 filters out stray single leftover values without excluding real
  // short tables. The first and last blocks are file header/footer metadata
  // (see comment above parseKosiText) and are excluded from board/load/tank
  // classification, since their large telemetry values (hundreds/thousands)
  // would otherwise get mistaken for board numbers — but NOT from distance
  // detection, which is decimal-fingerprinted and our highest-confidence field.
  const boardTokenBlocks = [];  // e.g. "2L","9L",... in table row order
  const boardNumBlocks = [];    // fallback: bare board numbers, no L/R suffix
  const loadsBlocks = [];
  const tankBlocks = [];
  const preciseDistBlocks = []; // decimal per-row stop distances (feet)
  let condCandidate = null;     // first adjacent pair of word tokens found in any block
  const MAX_LANE_BOARD = 40;    // a lane is ~39 boards wide; bounds the board-number fallback

  blocks.forEach((b, bi) => {
    if (!condCandidate) {
      for (let i = 0; i < b.length - 1; i++) {
        if (/^[A-Za-z]{2,}$/.test(b[i]) && /^[A-Za-z]{2,}$/.test(b[i + 1])) {
          condCandidate = [b[i], b[i + 1]];
          break;
        }
      }
    }
    if (b.length < 2) return;
    const isEdgeBlock = bi === 0 || bi === blocks.length - 1; // header / footer metadata
    if (!isEdgeBlock && b.every(v => /^\d+[LR]$/i.test(v))) { boardTokenBlocks.push(b); return; }
    if (!isEdgeBlock && b.every(v => /^[A-Za-z]$/.test(v))) { tankBlocks.push(b); return; }
    if (b.every(v => /^-?\d+(\.\d+)?$/.test(v))) {
      const nums = b.map(Number);
      const hasDecimal = b.some(v => v.indexOf('.') !== -1);
      if (hasDecimal) { preciseDistBlocks.push(nums); return; } // trusted even at the edges
      if (isEdgeBlock) return;
      const allEqual = nums.every(n => n === nums[0]);
      if (allEqual) return; // constant MICS/BUFF-style setting block — not needed
      const maxVal = Math.max(...nums), minVal = Math.min(...nums);
      if (maxVal <= 10) { loadsBlocks.push(nums); return; }
      if (minVal >= 1 && maxVal <= MAX_LANE_BOARD) { boardNumBlocks.push(nums); return; }
      // outside board range (SPEED/MIC settings or stray telemetry) — not needed
    }
  });

  if (preciseDistBlocks.length === 0) {
    throw new Error("Couldn't find a distance table in this file — it may not be a Kegel KOSI export.");
  }

  const distanceFt = Math.round(preciseDistBlocks[0][preciseDistBlocks[0].length - 1]);

  const distinctTanks = new Set();
  tankBlocks.forEach(b => b.forEach(v => distinctTanks.add(v.toUpperCase())));
  const tankDetected = distinctTanks.size > 0;
  let tank = distinctTanks.size > 1 ? 'dual' : 'single';

  // Conditioner names (Fire/Ice/etc.) appear as plain words when the pattern
  // specifies a real formula; generic exports just repeat the tank brand
  // (e.g. "KEGEL"/"KEGEL"), which won't match any of our conditioner keys.
  let cond1 = null, cond2 = null;
  if (condCandidate) {
    const keys = Object.keys(CONDITIONERS);
    const mapWord = w => keys.find(k => k.toUpperCase() === w.toUpperCase()) || null;
    const c1 = mapWord(condCandidate[0]), c2 = mapWord(condCandidate[1]);
    if (c1 && c2 && c1 !== c2) { cond1 = c1; cond2 = c2; tank = 'dual'; }
    else if (c1) { cond1 = c1; }
    else if (c2) { cond1 = c2; }
  }

  const warnings = [];
  if (!tankDetected && tank === 'single') {
    warnings.push("No tank letter found in this file — defaulted to single tank; verify against the printed sheet.");
  }
  let ratioEstimate = null, wallBoardEstimate = null;
  const boardSets = boardTokenBlocks.length >= 3 ? boardTokenBlocks : boardNumBlocks;
  const fwdBoards = boardSets[0], revBoards = boardSets[2];

  if (loadsBlocks.length >= 2 && fwdBoards && revBoards) {
    const boardLoadTotals = {};
    [[loadsBlocks[0], fwdBoards], [loadsBlocks[1], revBoards]].forEach(([loadsArr, boardsArr]) => {
      const n = Math.min(loadsArr.length, boardsArr.length);
      for (let i = 0; i < n; i++) {
        const boardNum = parseInt(String(boardsArr[i]), 10);
        if (Number.isNaN(boardNum)) continue;
        boardLoadTotals[boardNum] = (boardLoadTotals[boardNum] || 0) + loadsArr[i];
      }
    });
    const boardsWithLoad = Object.keys(boardLoadTotals).map(Number).filter(b => boardLoadTotals[b] > 0);
    if (boardsWithLoad.length >= 2) {
      const loadVals = boardsWithLoad.map(b => boardLoadTotals[b]);
      const maxLoad = Math.max(...loadVals), minLoad = Math.min(...loadVals);
      ratioEstimate = minLoad > 0 ? Math.round((maxLoad / minLoad) * 100) / 100 : null;
      wallBoardEstimate = Math.max(...boardsWithLoad);
    } else {
      warnings.push("Couldn't isolate enough board/load data to estimate ratio or wall board.");
    }
  } else {
    warnings.push("Couldn't isolate load-count tables — ratio and wall board weren't estimated.");
  }

  return { name, distanceFt, tank, tankDetected, cond1, cond2, ratioEstimate, wallBoardEstimate, warnings };
}

function bandColors(hue) {
  return { bg: `oklch(0.28 0.09 ${hue})`, fg: `oklch(0.86 0.09 ${hue})` };
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

let state = {
  screen: 'results',
  arsenal: SEED_ARSENAL,
  pattern: DEFAULT_PATTERN,
  savedPatterns: [],
  patternNameDraft: '',
  bowlers: SEED_BOWLERS,
  activeBowlerId: 'bw1',
  ballForm: null,
  bowlerForm: null,
  detailBallId: null,
  sessionLogBowlerId: null,
  sessionForm: null,
};

let kosiParseResult = null;
let kosiParseError = null;

(function loadState() {
  try {
    const raw = localStorage.getItem('bfm-v1');
    if (raw) {
      const saved = JSON.parse(raw);
      state.arsenal = (saved.arsenal && saved.arsenal.length) ? saved.arsenal : SEED_ARSENAL;
      state.pattern = saved.pattern || DEFAULT_PATTERN;
      state.savedPatterns = saved.savedPatterns || [];
      state.bowlers = (saved.bowlers && saved.bowlers.length) ? saved.bowlers : SEED_BOWLERS;
      state.activeBowlerId = saved.activeBowlerId || (saved.bowlers && saved.bowlers[0] && saved.bowlers[0].id) || 'bw1';
    }
  } catch (e) {}
})();

function persist() {
  try {
    localStorage.setItem('bfm-v1', JSON.stringify({
      arsenal: state.arsenal,
      pattern: state.pattern,
      savedPatterns: state.savedPatterns,
      bowlers: state.bowlers,
      activeBowlerId: state.activeBowlerId,
    }));
  } catch (e) {}
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------

function setScreen(s) { state.screen = s; state.detailBallId = null; render(); }

function openNewBallForm() { state.ballForm = { ...BALL_DEFAULTS, id: null, isNew: true }; render(); }
function openEditBallForm(id) {
  const ball = state.arsenal.find(b => b.id === id);
  if (ball) { state.ballForm = { ...ball, isNew: false }; render(); }
}
function closeBallForm() { state.ballForm = null; render(); }
function saveBallForm() {
  const draft = state.ballForm;
  if (!draft) return;
  const name = (draft.name || '').trim() || 'Unnamed ball';
  const clean = { ...draft, name };
  if (draft.isNew || !draft.id) {
    clean.id = 'b' + Date.now();
    state.arsenal = [...state.arsenal, clean];
  } else {
    state.arsenal = state.arsenal.map(b => (b.id === draft.id ? clean : b));
  }
  delete clean.isNew;
  state.ballForm = null;
  persist(); render();
}
function deleteBall(id) {
  state.arsenal = state.arsenal.filter(b => b.id !== id);
  persist(); render();
}

function applyPreset(key) {
  const p = PRESETS[key];
  if (!p) return;
  state.pattern = { ...state.pattern, ...p };
  persist(); render();
}
function saveCurrentPatternAs() {
  const name = (state.patternNameDraft || '').trim();
  if (!name) return;
  const entry = { ...state.pattern, id: 'sp' + Date.now(), name };
  state.savedPatterns = [...state.savedPatterns, entry];
  state.patternNameDraft = '';
  persist(); render();
}
function loadSavedPattern(id) {
  const entry = state.savedPatterns.find(p => p.id === id);
  if (!entry) return;
  const { id: _id, name: _name, ...fields } = entry;
  state.pattern = { ...state.pattern, ...fields };
  persist(); render();
}
function deleteSavedPattern(id) {
  state.savedPatterns = state.savedPatterns.filter(p => p.id !== id);
  persist(); render();
}

function openNewBowlerForm() { state.bowlerForm = { ...BOWLER_DEFAULTS, id: null, isNew: true }; render(); }
function openEditBowlerForm(id) {
  const bw = state.bowlers.find(b => b.id === id);
  if (bw) { state.bowlerForm = { ...bw, isNew: false }; render(); }
}
function closeBowlerForm() { state.bowlerForm = null; render(); }
function saveBowlerForm() {
  const draft = state.bowlerForm;
  if (!draft) return;
  const name = (draft.name || '').trim() || 'Unnamed bowler';
  const clean = { ...draft, name };
  if (draft.isNew || !draft.id) {
    clean.id = 'bw' + Date.now();
    state.bowlers = [...state.bowlers, clean];
    if (!state.activeBowlerId) state.activeBowlerId = clean.id;
  } else {
    state.bowlers = state.bowlers.map(b => (b.id === draft.id ? clean : b));
  }
  delete clean.isNew;
  state.bowlerForm = null;
  persist(); render();
}
function deleteBowler(id) {
  state.bowlers = state.bowlers.filter(b => b.id !== id);
  if (state.activeBowlerId === id) state.activeBowlerId = state.bowlers[0] ? state.bowlers[0].id : null;
  persist(); render();
}
function setActiveBowler(id) { state.activeBowlerId = id; persist(); render(); }

// — Session log (Stage 5 launch-board calibration) —
function openSessionLog(bowlerId) { state.sessionLogBowlerId = bowlerId; state.sessionForm = null; render(); }
function closeSessionLog() { state.sessionLogBowlerId = null; state.sessionForm = null; render(); }
function openSessionForm() {
  state.sessionForm = { consistentConfirm: false, ballId: '', confirmedLaunchBoard: '', outLegBoards: '', backLegBoards: '', outcomeNote: '' };
  render();
}
function closeSessionForm() { state.sessionForm = null; render(); }
function saveSessionForm() {
  const draft = state.sessionForm;
  const bowler = state.bowlers.find(b => b.id === state.sessionLogBowlerId);
  if (!draft || !bowler) return;
  if (!draft.consistentConfirm || !Number.isFinite(draft.confirmedLaunchBoard)) return;
  const effWall = Math.round(applyLaneCondition(deriveStage1(state.pattern, relativeSpeedFor(bowler)), state.pattern.condition).effWall);
  const ball = draft.ballId ? state.arsenal.find(b => b.id === draft.ballId) : null;
  const entry = {
    id: 'sl' + Date.now(),
    createdAt: new Date().toISOString(),
    patternLabel: patternSummary(state.pattern) + ' · ' + state.pattern.condition,
    effWall,
    confirmedLaunchBoard: draft.confirmedLaunchBoard,
    ballId: ball ? ball.id : null,
    ballName: ball ? ball.name : null,
    outLegBoards: Number.isFinite(draft.outLegBoards) ? draft.outLegBoards : null,
    backLegBoards: Number.isFinite(draft.backLegBoards) ? draft.backLegBoards : null,
    outcomeNote: (draft.outcomeNote || '').trim(),
  };
  state.bowlers = state.bowlers.map(b => (b.id === bowler.id ? { ...b, sessionLog: [...(b.sessionLog || []), entry] } : b));
  state.sessionForm = null;
  persist(); render();
}
function deleteSession(entryId) {
  const bowlerId = state.sessionLogBowlerId;
  if (!bowlerId) return;
  state.bowlers = state.bowlers.map(b => (b.id === bowlerId ? { ...b, sessionLog: (b.sessionLog || []).filter(s => s.id !== entryId) } : b));
  persist(); render();
}

function openDetail(id) { state.detailBallId = id; render(); }
function closeDetail() { state.detailBallId = null; render(); }

// — Kegel KOSI import —
function handleKosiFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      kosiParseResult = parseKosiText(String(reader.result));
      kosiParseError = null;
    } catch (err) {
      kosiParseResult = null;
      kosiParseError = err.message || String(err);
    }
    render();
  };
  reader.onerror = () => {
    kosiParseResult = null;
    kosiParseError = 'Could not read that file.';
    render();
  };
  reader.readAsText(file);
}
function applyKosiImport() {
  const r = kosiParseResult;
  if (!r) return;
  const pattern = { ...state.pattern, sheet_length: r.distanceFt, tank: r.tank };
  if (r.ratioEstimate != null) pattern.sheet_ratio = r.ratioEstimate;
  if (r.wallBoardEstimate != null) pattern.wall_board = r.wallBoardEstimate;
  if (r.cond1) pattern.cond1 = r.cond1;
  if (r.cond2) pattern.cond2 = r.cond2;
  state.pattern = pattern;
  state.patternNameDraft = r.name;
  kosiParseResult = null;
  persist(); render();
}
function dismissKosiImport() { kosiParseResult = null; kosiParseError = null; render(); }

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------

function computeResults() {
  const bowler = state.bowlers.find(b => b.id === state.activeBowlerId);
  return state.arsenal.map(ball => {
    const r = fullScore(ball, state.pattern, bowler);
    const b = bandFor(r.total);
    const c = bandColors(b.hue);
    return {
      ...ball, ...r,
      total: Math.round(r.total),
      sheetTotal: Math.round(r.sheetTotal),
      showSheet: Math.abs(r.total - r.sheetTotal) >= 3,
      bandLabel: b.label, bandSub: b.sub, bandBg: c.bg, bandFg: c.fg,
      lengthPct: Math.round(r.lengthScore * 100),
      surfacePct: Math.round(r.surfaceScore * 100),
      recoveryPct: Math.round(r.recoveryScore * 100),
      corePct: Math.round(r.coreScore * 100),
      radarPts: radarPoints(r.lengthScore, r.surfaceScore, r.recoveryScore, r.coreScore),
      insight: insightFor(r, r.total),
    };
  }).sort((a, b) => b.total - a.total).map((r, i) => ({ ...r, rank: i + 1 }));
}

function renderArsenalScreen() {
  const cards = state.arsenal.map(ball => `
    <div class="card card-row" data-action="edit-ball" data-id="${ball.id}">
      <div class="card-row-head">
        <div class="card-title">${esc(ball.name)}</div>

      </div>
      <div class="card-tags">
        <span class="tag tag-neutral">RG ${Number(ball.rg).toFixed(2)}</span>

        <span class="tag tag-neutral">${esc(ball.cover.charAt(0).toUpperCase() + ball.cover.slice(1))}</span>
        <span class="tag tag-outline">${ball.asym ? 'Asym' : 'Sym'}</span>

}

  const cards = state.bowlers.map(bw => `

  const r = kosiParseResult;
  const body = r ? `
      <div class="kosi-summary">

function renderSessionLogDialog() {
  const bowler = state.bowlers.find(b => b.id === state.sessionLogBowlerId);
  if (!bowler) return '';
  const sessionLog = bowler.sessionLog || [];
  const fit = fitLaunchBoardRegression(sessionLog);
  const statusLine = fit
    ? `Personal fit active — launch board ≈ wall × ${fit.slope.toFixed(2)} + ${fit.intercept.toFixed(2)} (from ${fit.n} sessions).`
    : `Cold start — using wall + 10 until 5 sessions are logged (${sessionLog.length}/5).`;

  const f = state.sessionForm;
  let formBody;
  if (f) {
    const effWall = Math.round(applyLaneCondition(deriveStage1(state.pattern, relativeSpeedFor(bowler)), state.pattern.condition).effWall);
    const canSave = !!f.consistentConfirm && Number.isFinite(f.confirmedLaunchBoard);
    formBody = `
      <div class="kosi-warn">Log one entry per <b>consistent session</b> — the same ball, the same target line, your normal release, ideally averaged over a full game. A single stray shot, or mixing different balls/lines/releases into one entry, makes the fit worse, not better.</div>
      <div class="field" style="margin-top:8.4px;">
        <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:400;">
          <input type="checkbox" style="margin-top:3px;" ${f.consistentConfirm ? 'checked' : ''} data-scope="sessionForm" data-field="consistentConfirm" data-parse="checkbox"/>
          <span>This reading is from a full game (or a consistent stretch of shots) with one ball, one line, one release — not a single shot.</span>
        </label>
      </div>
      <div class="field">
        <label>Effective wall board (today's pattern): <b>${effWall}</b></label>
      </div>
      <div class="field">
        <label>Ball</label>
        <select class="input" data-scope="sessionForm" data-field="ballId" data-parse="string">
          <option value="">Not specified</option>
          ${state.arsenal.map(b => `<option value="${b.id}" ${f.ballId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Launch board (average for the session, not a single shot)</label>
        <input class="input" type="number" value="${f.confirmedLaunchBoard}" data-scope="sessionForm" data-field="confirmedLaunchBoard" data-parse="floatOrEmpty"/>
      </div>
      <div class="field">
        <label>Out-leg boards <span class="text-muted" style="font-size:11px;">(optional, not used in scoring yet)</span></label>
        <input class="input" type="number" value="${f.outLegBoards}" data-scope="sessionForm" data-field="outLegBoards" data-parse="floatOrEmpty"/>
      </div>
      <div class="field">
        <label>Back-leg boards <span class="text-muted" style="font-size:11px;">(optional, not used in scoring yet)</span></label>
        <input class="input" type="number" value="${f.backLegBoards}" data-scope="sessionForm" data-field="backLegBoards" data-parse="floatOrEmpty"/>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Outcome note <span class="text-muted" style="font-size:11px;">(optional)</span></label>
        <input class="input" type="text" value="${esc(f.outcomeNote || '')}" placeholder="e.g. carried well, left a 10 twice" data-scope="sessionForm" data-field="outcomeNote" data-parse="string"/>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-action="session-form-cancel">Cancel</button>
        <button class="btn btn-primary" data-action="session-form-save" ${canSave ? '' : 'disabled'}>Save session</button>
      </div>
    `;
  } else {
    formBody = `<button class="btn btn-primary" data-action="open-session-form" style="margin-bottom:11.2px;">+ Log a session</button>`;
  }

  const sorted = [...sessionLog].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const entriesList = sorted.length === 0 ? '' : `
    <div class="card-kicker" style="margin-top:11.2px;">Logged sessions</div>
    ${sorted.map(s => `
      <div class="card pattern-row">
        <div style="flex:1;">
          <div class="card-title" style="font-size:13px;">${esc(s.patternLabel || 'Pattern')}</div>
          <div class="text-muted" style="font-size:11px;">wall ${s.effWall} → launch ${s.confirmedLaunchBoard}${s.ballName ? ' · ' + esc(s.ballName) : ''}${s.outcomeNote ? ' · ' + esc(s.outcomeNote) : ''}</div>
        </div>
        <button class="btn btn-ghost" data-action="delete-session" data-id="${s.id}">Remove</button>
      </div>
    `).join('')}
  `;

  return `
  <div class="dialog-backdrop" data-action="noop">
    <div class="dialog" data-action="noop">
      <div class="dialog-title">${esc(bowler.name)}'s session log</div>
      <div class="text-muted" style="font-size:12.5px;margin-bottom:11.2px;">${statusLine}</div>
      ${formBody}
      ${entriesList}
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-action="close-session-log">Close</button>
      </div>
    </div>
  </div>`;
}

          <polygon points="${ball.radarPts}" fill="var(--color-accent-800)" stroke="var(--color-accent)" stroke-width="2"/>
          <text x="65" y="10" text-anchor="middle" font-size="11" font-weight="600" fill="var(--color-neutral-300)">Length</text>
          <text x="120" y="69" text-anchor="start" font-size="11" font-weight="600" fill="var(--color-neutral-300)">Surface</text>
          <text x="65" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="var(--color-neutral-300)">Recovery</text>
          <text x="8" y="69" text-anchor="end" font-size="11" font-weight="600" fill="var(--color-neutral-300)">Core</text>
        </svg>
      </div>
      <div class="card" style="gap:0;">
        <div class="detail-metric"><div class="detail-metric-head"><span>Length</span><b>${ball.lengthPct}%</b></div><div class="detail-metric-sub">Does the ball's skid distance match this pattern's oil zone?</div></div>
        <div class="detail-metric"><div class="detail-metric-head"><span>Surface</span><b>${ball.surfacePct}%</b></div><div class="detail-metric-sub">Does the cover read at the right time for this pattern?</div></div>
        <div class="detail-metric"><div class="detail-metric-head"><span>Recovery</span><b>${ball.recoveryPct}%</b></div><div class="detail-metric-sub">Can the layout make it back to the pocket from the breakpoint?</div></div>
        <div class="detail-metric"><div class="detail-metric-head"><span>Core</span><b>${ball.corePct}%</b></div><div class="detail-metric-sub">Does the core shape suit this pattern type?</div></div>
      </div>
      <div class="card" style="font-size:13px;">${esc(ball.insight)}</div>
      ${ball.showSheet ? `<div class="card" style="font-size:13px;background:var(--color-accent-900);">The sheet alone scores this at <b>${ball.sheetTotal}</b> — house conditions shift it to <b>${ball.total}</b> today.</div>` : ''}
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-action="close-detail">Close</button>
      </div>
    </div>
  </div>`;
}

function render() {
  document.getElementById('pattern-type-tag').textContent = PT_LABELS[state.pattern.pattern_type] || state.pattern.pattern_type;
  document.querySelectorAll('#tab-seg input[name="tab"]').forEach(el => { el.checked = el.value === state.screen; });

  const screenEl = document.getElementById('screen');
  if (state.screen === 'arsenal') screenEl.innerHTML = renderArsenalScreen();
  else if (state.screen === 'profile') screenEl.innerHTML = renderProfileScreen();
  else if (state.screen === 'pattern') screenEl.innerHTML = renderPatternScreen();
  else screenEl.innerHTML = renderResultsScreen();

  document.getElementById('dialogs').innerHTML = renderBallDialog() + renderBowlerDialog() + renderSessionLogDialog() + renderDetailDialog();
}

// ---------------------------------------------------------------------------
// Event delegation
// ---------------------------------------------------------------------------

function parseValue(el) {
  const parse = el.dataset.parse;
  const raw = el.value;
  if (parse === 'float') return parseFloat(raw);
  if (parse === 'floatOrEmpty') return raw === '' ? '' : parseFloat(raw);
  if (parse === 'bool') return raw === 'true';
  if (parse === 'checkbox') return el.checked;
  return raw;
}

function setField(scope, field, value) {
  if (scope === 'root') state[field] = value;
  else state[scope] = { ...state[scope], [field]: value };
}

function formatLabel(scope, field, value) {
  const two = ['ballForm.rg','bowlerForm.pap_lateral','bowlerForm.pap_vertical'];
  const three = ['ballForm.diff','ballForm.psa','ballForm.pinBuffer','ballForm.massBiasToPap','ballForm.ptp'];
  const bowlerThree = ['bowlerForm.pap_lateral','bowlerForm.pap_vertical'];
  const key = scope + '.' + field;
  if (key === 'ballForm.rg') return Number(value).toFixed(2);
  if (key === 'ballForm.diff' || key === 'ballForm.psa') return Number(value).toFixed(3);
  if (key === 'ballForm.ptp') return Number(value).toFixed(2);
  if (key === 'ballForm.pinBuffer' || key === 'ballForm.massBiasToPap') return Number(value).toFixed(3);
  if (key === 'ballForm.grit' || key === 'ballForm.angle' || key === 'ballForm.valAngle' || key === 'ballForm.psaAngle') return Math.round(value);
  if (key === 'bowlerForm.pap_lateral' || key === 'bowlerForm.pap_vertical') return Number(value).toFixed(3);
  if (key === 'bowlerForm.speed') return Number(value).toFixed(1);
  if (key === 'bowlerForm.rev_rate') return Math.round(value);
  if (key === 'pattern.sheet_length' || key === 'pattern.wall_board') return value;
  if (key === 'pattern.sheet_ratio') return value;
  if (key === 'pattern.idealAngle') return Math.round(value);
  return value;
}

document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-scope][data-field]');
  if (!el) return;
  const scope = el.dataset.scope, field = el.dataset.field;
  const value = parseValue(el);
  setField(scope, field, value);

  const lbl = document.querySelector(`[data-label="${scope}.${field}"]`);
  if (lbl) lbl.textContent = formatLabel(scope, field, value);

  if (scope === 'pattern' && ['sheet_length','sheet_ratio','wall_board','cond1','cond2','tank','pattern_type','condition','launch_override'].includes(field)) {
    const activeBowler = state.bowlers.find(b => b.id === state.activeBowlerId);
    const base = deriveStage1(state.pattern, relativeSpeedFor(activeBowler));
    const preview = applyLaneCondition(base, state.pattern.condition);
    const lenEl = document.querySelector('[data-preview="len"]');
    const ratioEl = document.querySelector('[data-preview="ratio"]');
    const wallEl = document.querySelector('[data-preview="wall"]');
    if (lenEl) lenEl.textContent = Math.round(preview.effLen) + 'ft';
    if (ratioEl) ratioEl.textContent = preview.effRatio.toFixed(1) + ':1';
    if (wallEl) wallEl.textContent = Math.round(preview.effWall);
  }
  persist();
});

document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-scope][data-field]');
  if (!el) return;
  const scope = el.dataset.scope, field = el.dataset.field;
  setField(scope, field, parseValue(el));
  persist();
  render();
});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  if (action === 'noop') return;
  e.stopPropagation();
  switch (action) {
    case 'open-new-ball': openNewBallForm(); break;
    case 'edit-ball': openEditBallForm(id); break;
    case 'delete-ball': deleteBall(id); break;
    case 'ball-form-save': saveBallForm(); break;
    case 'ball-form-cancel': closeBallForm(); break;
    case 'open-new-bowler': openNewBowlerForm(); break;
    case 'edit-bowler': openEditBowlerForm(id); break;
    case 'delete-bowler': deleteBowler(id); break;
    case 'set-active-bowler': setActiveBowler(id); break;
    case 'bowler-form-save': saveBowlerForm(); break;
    case 'bowler-form-cancel': closeBowlerForm(); break;
    case 'open-session-log': openSessionLog(id); break;
    case 'close-session-log': closeSessionLog(); break;
    case 'open-session-form': openSessionForm(); break;
    case 'session-form-cancel': closeSessionForm(); break;
    case 'session-form-save': saveSessionForm(); break;
    case 'delete-session': deleteSession(id); break;
    case 'apply-preset': applyPreset(el.dataset.preset); break;
    case 'save-pattern-as': saveCurrentPatternAs(); break;
    case 'load-pattern': loadSavedPattern(id); break;
    case 'delete-pattern': deleteSavedPattern(id); break;
    case 'open-detail': openDetail(id); break;
    case 'close-detail': closeDetail(); break;
    case 'kosi-file-trigger': {
      const input = document.getElementById('kosi-file-input');
      if (input) input.click();
      break;
    }
    case 'kosi-apply': applyKosiImport(); break;
    case 'kosi-dismiss': dismissKosiImport(); break;
  }
});

document.getElementById('tab-seg').addEventListener('change', (e) => {
  if (e.target.name === 'tab') setScreen(e.target.value);
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'kosi-file-input') {
    handleKosiFile(e.target.files[0]);
  }
});

render();
</script>
</body>
</html>
